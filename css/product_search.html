<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=0, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <input type="search" placeholder="Search for Products..." id="productSearch">
    <button id="search">Search</button>
    <div id="product-container"></div>
    <script>
     
     //hardcoded dataset
      const products = [ 
        {
            id: 1,
            name: "laptop",
            price: 500000,
            category: "Electronics"
        },
        {
            id: 20,
            name: "dell laptop",
            price: 500000,
            category: "Electronics"
        },
        {
            id: 1,
            name: "hp laptop",
            price: 500000,
            category: "Electronics"
        },
        {
            id: 2,
            name: "phone",
            price: 300000,
            category: "Electronics"
        },
        {
            id: 3,
            name: "shoe",
            price: 80000,
            category: "Fashion"
        },
        {
            id: 4,
            name: "watch",
            price: 5000,
            category: "Fashion"
        },
        {
            id: 5,
            name: "Headset",
            price: 10000,
            category: "Electronics"
        }
     ];


     let searchButt = document.getElementById("search");
     let productContainer = document.getElementById('product-container');
     let output = '';

      searchButt.addEventListener("click",()=>{
           let searchInput = document.getElementById("productSearch").value;  
           
           const productFilter = products.filter((product)=>{
                    return product.name.includes(searchInput);
           });
         
           productFilter.forEach(x=>{
                    output +=`
                    <div class='product-card'>
                    <div class='product-name'>${x.name}</div>
                    <p class='price'>${x.price}</p>
                    <h3>${x.category}</h3>
                    </div>    
                        `;  
           });
        

        productContainer.innerHTML = output;
        output = '';
      }); 
    </script>
</body>
</html>
